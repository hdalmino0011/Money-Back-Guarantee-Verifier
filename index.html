<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refund Checker</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Refund Checker</h1>

    <div class="form-group">
      <label>Order Date</label>
      <input type="date" id="orderDate">
    </div>

    <div class="form-group">
      <label>Money-Back Guarantee Days</label>
      <input type="number" id="guaranteeDays" placeholder="e.g. 30">
    </div>

    <div class="form-group">
      <label>Today's Date</label>
      <input type="date" id="todayDate">
    </div>

    <button onclick="calculate()">Calculate</button>

    <footer>All Rights Reserved 2026</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
