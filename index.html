<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utility Tool</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HOME -->
<div class="container" id="home">
  <h1>Utility Tool</h1>

  <button onclick="showSection('guarantee')">Money Back Guarantee Checker</button>
  <button onclick="showSection('discount')">Discount Calculator</button>
  <button onclick="showSection('timeframe')">Refund Timeframe Tracker</button>
  <button onclick="showSection('aht')">AHT Time Converter</button>
  <button onclick="showSection('notes')">Notations Format</button>

  <footer>All Rights Reserved 2026</footer>
</div>

<!-- REFUND CHECKER -->
<div class="container hidden" id="guarantee">
  <h1>Refund Checker</h1>
  <input type="date" id="orderDate">
  <input type="number" id="guaranteeDays" placeholder="Guarantee Days">
  <input type="date" id="todayDate">
  <button onclick="calculateRefund()">Calculate</button>
  <button class="back" onclick="goHome()">Back</button>
  <div id="refundResult"></div>
  <footer>All Rights Reserved 2026</footer>
</div>

<!-- DISCOUNT -->
<div class="container hidden" id="discount">
  <h1>Discount Calculator</h1>
  <input type="number" id="amount" placeholder="Enter amount">
  <button onclick="calculateDiscount()">Calculate</button>
  <button class="back" onclick="goHome()">Back</button>
  <div id="discountResult"></div>
  <footer>All Rights Reserved 2026</footer>
</div>

<!-- TIMEFRAME -->
<div class="container hidden" id="timeframe">
  <h1>Refund Timeframe</h1>
  <input type="date" id="refundDate">

  <select id="range">
    <option value="3-5">3-5 Business Days</option>
    <option value="7-14">7-14 Business Days</option>
  </select>

  <button onclick="calculateTimeframe()">Calculate</button>
  <button class="back" onclick="goHome()">Back</button>

  <div id="timeframeResult"></div>
  <footer>All Rights Reserved 2026</footer>
</div>

<!-- AHT -->
<div class="container hidden" id="aht">
  <h1>AHT Converter</h1>
  <input type="number" id="seconds" placeholder="Enter seconds">
  <button onclick="convertAHT()">Convert</button>
  <button class="back" onclick="goHome()">Back</button>
  <div id="ahtResult"></div>
  <footer>All Rights Reserved 2026</footer>
</div>

<!-- NOTES -->
<div class="container hidden" id="notes">
  <h1>Notations</h1>

  <textarea id="notesBox" rows="12"></textarea>

  <button onclick="loadNotes(1)">Type 1</button>
  <button onclick="loadNotes(2)">Type 2</button>
  <button onclick="loadNotes(3)">Type 3</button>
  <button onclick="copyNotes()">Copy</button>

  <button class="back" onclick="goHome()">Back</button>

  <footer>All Rights Reserved 2026</footer>
</div>

<script src="script.js"></script>
</body>
</html>
