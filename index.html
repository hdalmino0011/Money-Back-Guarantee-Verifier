<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utility App</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HOME SCREEN -->
  <div class="container" id="home">
    <h1>Utility Tool</h1>

    <button onclick="showGuarantee()">Money Back Guarantee Checker</button>
    <button onclick="showDiscount()">Discount Price Calculator</button>

    <footer>All Rights Reserved 2026</footer>
  </div>

  <!-- GUARANTEE CHECKER -->
  <div class="container hidden" id="guarantee">
    <h1>Refund Checker</h1>

    <div class="form-group">
      <label>Order Date</label>
      <input type="date" id="orderDate">
    </div>

    <div class="form-group">
      <label>Money-Back Guarantee Days</label>
      <input type="number" id="guaranteeDays">
    </div>

    <div class="form-group">
      <label>Today's Date</label>
      <input type="date" id="todayDate">
    </div>

    <button onclick="calculateRefund()">Calculate</button>
    <button class="back" onclick="goHome()">Back</button>

    <div id="refundResult"></div>

    <footer>All Rights Reserved 2026</footer>
  </div>

  <!-- DISCOUNT CALCULATOR -->
  <div class="container hidden" id="discount">
    <h1>Discount Calculator</h1>

    <div class="form-group">
      <label>Total Amount</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <button onclick="calculateDiscount()">Calculate Discounts</button>
    <button class="back" onclick="goHome()">Back</button>

    <div id="discountResult"></div>

    <footer>All Rights Reserved 2026</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
